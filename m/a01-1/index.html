const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:IT,hash:"SHA-256"},k,{name:"AES-GCM",length:256},true,["decrypt"]);}
async function dec(key,data){const d=b64(data);return crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12));}
async function show(key){const buf=await dec(key,CT);document.open();document.write(new TextDecoder().decode(buf));document.close();
 window.__key=key;}
async function useKey(){const r=sessionStorage.getItem("shk");if(!r)return false;
 try{const key=await crypto.subtle.importKey("raw",b64(r),"AES-GCM",true,["decrypt"]);await show(key);hook(key);return true}catch(e){sessionStorage.removeItem("shk");return false}}
function hook(key){setTimeout(()=>{document.querySelectorAll("a[download]").forEach(a=>{a.addEventListener("click",async ev=>{ev.preventDefault();
 const r=await fetch(a.getAttribute("href")+".enc");const t=await r.text();const buf=await dec(key,t.trim());
 const u=URL.createObjectURL(new Blob([buf],{type:"application/pdf"}));const x=document.createElement("a");x.href=u;x.download=a.getAttribute("download");document.body.appendChild(x);x.click();});});},50);}
async function go(){const pw=document.getElementById("p").value;try{const key=await derive(pw);await dec(key,CT);
 const raw=new Uint8Array(await crypto.subtle.exportKey("raw",key));sessionStorage.setItem("shk",btoa(String.fromCharCode(...raw)));await show(key);hook(key);}catch(e){document.getElementById("e").textContent="密碼錯誤";}}
useKey().then(ok=>{if(!ok){document.getElementById("g").style.display="block";document.getElementById("b").onclick=go;
 document.getElementById("p").addEventListener("keydown",e=>{if(e.key==="Enter")go()});}});
</script></body></html>
